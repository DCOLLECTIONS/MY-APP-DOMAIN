<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE MASENO CHURCH</title>
  <style>
    body { font-family: poppins; sans-serif; margin: 0; text-align: center; }
    header { background: #000b49; color: rgb(255, 217, 0); padding: 60px 20px; }
    section { padding: 40px 20px; max-width: 700px; margin: auto; }
    footer { background: #bd0000; padding: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1 class="church-name">THE MASENO CHURCH</h1>
    <p>Welcome to Our Online Church Blessed family</p>
  </header>

  <section>
    <h2>Service Times</h2>
    <p>Sunday Services, 7:00 AM</p>
  </section>

  <section>
    <h2>Contact</h2>
    <p>Phone: SNR PASTOR( Blessed Deputy Archbishop Dennis Kere ) -07 2862 1907 </p>
  </section>

  <footer>
    &copy; <span id="year"></span> <span class="church-name">MASENO CHURCH</span>
  </footer>

  <script>
    // ✏️ EDIT YOUR CHURCH NAME HERE (only this line)
    const CHURCH_NAME = "THE MASENO CHURCH";

    document.title = CHURCH_NAME;
    document.querySelectorAll(".church-name").forEach(function (el) {
      el.textContent = CHURCH_NAME;
    });
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
